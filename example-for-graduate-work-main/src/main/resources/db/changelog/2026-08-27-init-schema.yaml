databaseChangeLog:
- changeSet:
    id: 1
    author: your-team
    changes:
      - createTable:
          tableName: users
          columns:
            - column: { name: id, type: int, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
            - column: { name: email, type: varchar(255), constraints: { unique: true, nullable: false } }
            - column: { name: password, type: varchar(255), constraints: { nullable: false } }
            - column: { name: first_name, type: varchar(16), constraints: { nullable: false } }
            - column: { name: last_name, type: varchar(16), constraints: { nullable: false } }
            - column: { name: phone, type: varchar(20) }
            - column: { name: role, type: varchar(10), constraints: { nullable: false } }
            - column: { name: image, type: varchar(255) }
      - createTable:
          tableName: ads
          columns:
            - column: { name: pk, type: int, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
            - column: { name: title, type: varchar(32), constraints: { nullable: false } }
            - column: { name: price, type: int, constraints: { nullable: false } }
            - column: { name: description, type: varchar(64), constraints: { nullable: false } }
            - column: { name: image, type: varchar(255) }
            - column: { name: author_id, type: int, constraints: { nullable: false, foreignKeyName: fk_ads_author, references: users(id) } }
      - createTable:
          tableName: comments
          columns:
            - column: { name: pk, type: int, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
            - column: { name: text, type: varchar(64), constraints: { nullable: false } }
            - column: { name: created_at, type: timestamp, constraints: { nullable: false } }
            - column: { name: author_id, type: int, constraints: { nullable: false, foreignKeyName: fk_comments_author, references: users(id) } }
            - column: { name: ad_id, type: int, constraints: { nullable: false, foreignKeyName: fk_comments_ad, references: ads(pk) } }